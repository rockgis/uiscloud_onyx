name: onyx

# =============================================================================
# 릴리즈 배포 오버라이드
#
# 폐쇄망 배포용 최종 설정:
#   - 외부 포트: 8082 (HTTP)  — 80/443 대신 사용
#   - nginx 설정: HTTP 전용 템플릿 사용
#
# 적용 순서 (deploy.sh가 자동 관리):
#   docker compose \
#     -f docker-compose.prod.yml \      # 기본 서비스 정의
#     -f docker-compose.uiscloud.yml \  # 커스텀 이미지
#     -f docker-compose.airgap.yml \    # 경로 교정 (../data/ → ./data/)
#     -f docker-compose.release.yml     # 포트 8082, HTTP 전용 ← 이 파일
# =============================================================================

services:

  # ── nginx: HTTP 전용 템플릿 사용 ────────────────────────────────────────────
  # 포트(SERVICE_PORT:80)는 package.sh에서 docker-compose.prod.yml에 직접 적용
  # app.conf.template.prod (SSL) 대신 app.conf.template (HTTP only) 사용
  nginx:
    command: >
      /bin/sh -c "dos2unix /etc/nginx/conf.d/run-nginx.sh
      && /etc/nginx/conf.d/run-nginx.sh app.conf.template"

