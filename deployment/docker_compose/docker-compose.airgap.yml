name: onyx

# =============================================================================
# 폐쇄망(Air-Gap) 배포 오버라이드
#
# docker-compose.prod.yml의 ../data/ 경로를 압축 해제 위치 기준의 ./data/ 로
# 재정의합니다. 패키지를 임의의 디렉터리에 압축 해제한 뒤 그 위치에서 바로
# 실행할 수 있도록 경로를 교정합니다.
#
# 사용법 (deploy.sh가 자동 포함):
#   docker compose \
#     -f docker-compose.prod.yml \
#     -f docker-compose.uiscloud.yml \
#     -f docker-compose.airgap.yml \
#     up -d
# =============================================================================

services:

  # nginx: ../data/nginx → ./data/nginx
  nginx:
    volumes: !reset
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

  # certbot: ../data/certbot → ./data/certbot
  certbot:
    volumes: !reset
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
