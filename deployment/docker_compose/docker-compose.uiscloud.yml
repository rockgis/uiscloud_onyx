name: onyx

# UISCloud 프로덕션 오버라이드
#
# 사용법:
#   docker compose -f docker-compose.prod.yml -f docker-compose.uiscloud.yml up -d
#
# 역할:
#   1. UISCloud 커스텀 이미지로 교체 (web-server, backend, model-server)
#      - web-server: 한국어 i18n, UISCloud UI 커스터마이징
#      - backend: 임베딩 모델 변경 API 활성화, 이벤트 루프 블로킹 수정
#      - model-server: BGE-M3(1024-dim, 한국어+영어) 사전 탑재
#   2. 내부 서비스 포트 노출 제거 (프로덕션 보안 강화)

services:
  # ── UISCloud 커스텀 이미지 ──────────────────────────────────────────────────

  web_server:
    # CI/CD 자동 빌드: ghcr.io/rockgis/uiscloud_onyx/web-server (multi-arch: amd64+arm64)
    image: ${UISCLOUD_WEB_IMAGE:-ghcr.io/rockgis/uiscloud_onyx/web-server:latest}
    build: !reset null

  api_server:
    # CI/CD 자동 빌드: ghcr.io/rockgis/uiscloud_onyx/onyx-backend (multi-arch: amd64+arm64)
    # 변경사항: 임베딩 모델 변경 API(set-new-search-settings) 활성화
    image: ${UISCLOUD_BACKEND_IMAGE:-ghcr.io/rockgis/uiscloud_onyx/onyx-backend:latest}
    build: !reset null

  background:
    # api_server와 동일한 backend 이미지 사용
    image: ${UISCLOUD_BACKEND_IMAGE:-ghcr.io/rockgis/uiscloud_onyx/onyx-backend:latest}
    build: !reset null

  inference_model_server:
    # CI/CD 자동 빌드: ghcr.io/rockgis/uiscloud_onyx/onyx-model-server (multi-arch: amd64+arm64)
    # 변경사항: BGE-M3 사전 탑재, 모델 로딩 이벤트 루프 블로킹 수정
    image: ${UISCLOUD_MODEL_SERVER_IMAGE:-ghcr.io/rockgis/uiscloud_onyx/onyx-model-server:latest}
    build: !reset null

  indexing_model_server:
    image: ${UISCLOUD_MODEL_SERVER_IMAGE:-ghcr.io/rockgis/uiscloud_onyx/onyx-model-server:latest}
    build: !reset null

  # ── 프로덕션 보안: 내부 서비스 포트 노출 제거 ─────────────────────────────
  # nginx만 외부에 노출하고 내부 서비스는 Docker 네트워크 내부에서만 통신

  # Vespa 벡터 DB 포트 제거 (19071, 8081)
  index:
    ports: !reset []

  # PostgreSQL 포트 제거 (5432)
  relational_db:
    ports: !reset []

  # Redis 포트 제거 (6379)
  cache:
    ports: !reset []

  # MinIO 포트 제거 (9000, 9001)
  minio:
    ports: !reset []
