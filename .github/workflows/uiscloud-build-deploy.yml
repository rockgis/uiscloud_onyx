name: UISCloud Build & Deploy

# =============================================================================
# UISCloud Onyx 이미지 빌드 및 배포 패키지 생성
#
# 트리거:
#   - main 브랜치 push → :main, :sha-{short} 태그로 빌드
#   - Release published → :v1.x.x, :latest 태그로 빌드 + 배포 패키지 첨부
#
# 빌드 플랫폼: linux/amd64, linux/arm64 (multi-arch)
# 이미지 저장소: ghcr.io/rockgis/uiscloud_onyx/
# =============================================================================

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  REGISTRY: ghcr.io/rockgis/uiscloud_onyx

jobs:
  # ── 이미지 빌드 & 푸시 ────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-server
            context: web
            dockerfile: web/Dockerfile
            build-args: |
              NEXT_PUBLIC_DISABLE_LOGOUT=
              NEXT_PUBLIC_THEME=
              NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=

          - service: onyx-backend
            context: backend
            dockerfile: backend/Dockerfile

          - service: onyx-model-server
            context: backend
            dockerfile: backend/Dockerfile.model_server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 릴리즈 배포 패키지 생성 ───────────────────────────────────────────────────
  release-package:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          VERSION="${{ github.ref_name }}"
          bash deployment/release/package.sh "$VERSION"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: deployment/release/dist/uiscloud-onyx.${{ github.ref_name }}.tar.gz
